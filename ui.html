<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Translation Settings</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      color: #333;
      background: #fff;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
    }

    .subtitle {
      margin: 0 0 20px 0;
      font-size: 11px;
      color: #666;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      font-family: 'Monaco', 'Courier New', monospace;
    }

    input:focus {
      outline: none;
      border-color: #18a0fb;
      box-shadow: 0 0 0 2px rgba(24, 160, 251, 0.1);
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #18a0fb;
      color: white;
    }

    .btn-primary:hover {
      background: #0d8ce8;
    }

    .btn-primary:active {
      background: #0c7dd1;
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      display: none;
    }

    .message.error {
      background: #fee;
      border: 1px solid #fcc;
      color: #c00;
    }

    .message.success {
      background: #efe;
      border: 1px solid #cfc;
      color: #060;
    }

    .message.show {
      display: block;
    }

    .info-box {
      margin-top: 16px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 4px;
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }

    .info-box a {
      color: #18a0fb;
      text-decoration: none;
    }

    .info-box a:hover {
      text-decoration: underline;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 8px;
    }

    .status.configured {
      background: #d4edda;
      color: #155724;
    }

    .status.not-configured {
      background: #fff3cd;
      color: #856404;
    }
  </style>
</head>
<body>
  <h2>⚙️ Translation Settings</h2>
  <p class="subtitle">Configure your Gemini API key for translations</p>

  <div class="form-group">
    <label for="api-key">
      Gemini API Key
      <span class="status not-configured" id="status">Not Configured</span>
    </label>
    <input
      type="password"
      id="api-key"
      placeholder="Enter your Gemini API key"
      autocomplete="off"
    >
  </div>

  <div class="button-group">
    <button class="btn-secondary" id="cancel-btn">Cancel</button>
    <button class="btn-primary" id="save-btn">Save API Key</button>
  </div>

  <div class="message" id="message"></div>

  <div class="info-box">
    <strong>💡 How to get an API key:</strong><br>
    1. Visit <a href="https://makersuite.google.com/app/apikey" target="_blank">Google AI Studio</a><br>
    2. Sign in with your Google account<br>
    3. Click "Create API Key"<br>
    4. Copy and paste it here
  </div>

  <script>
    const apiKeyInput = document.getElementById('api-key');
    const saveBtn = document.getElementById('save-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const messageDiv = document.getElementById('message');
    const statusSpan = document.getElementById('status');

    function showMessage(text, isError = false) {
      messageDiv.textContent = text;
      messageDiv.className = 'message show ' + (isError ? 'error' : 'success');
    }

    function hideMessage() {
      messageDiv.className = 'message';
    }

    function updateStatus(hasKey) {
      if (hasKey) {
        statusSpan.textContent = '✓ Configured';
        statusSpan.className = 'status configured';
      } else {
        statusSpan.textContent = 'Not Configured';
        statusSpan.className = 'status not-configured';
      }
    }

    // Save button
    saveBtn.addEventListener('click', () => {
      const apiKey = apiKeyInput.value.trim();

      hideMessage();

      if (!apiKey) {
        showMessage('Please enter an API key', true);
        return;
      }

      // Disable button and show loading
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      // Send to plugin code
      parent.postMessage({
        pluginMessage: {
          type: 'save-api-key',
          apiKey: apiKey
        }
      }, '*');
    });

    // Cancel button
    cancelBtn.addEventListener('click', () => {
      parent.postMessage({
        pluginMessage: {
          type: 'close'
        }
      }, '*');
    });

    // Listen for messages from plugin code
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'init') {
        updateStatus(msg.hasApiKey);
      } else if (msg.type === 'success') {
        showMessage(msg.message, false);
        updateStatus(true);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save API Key';
      } else if (msg.type === 'error') {
        showMessage(msg.message, true);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save API Key';
      }
    };

    // Auto-focus on input
    apiKeyInput.focus();
  </script>
</body>
</html>
